name: Daily Claude usage report

# 主要由 cron-job.org 每天 23:00 用 workflow_dispatch 觸發；
# backup.yml 的 GitHub 排程只是備援（會呼叫這個 workflow）。
# 這裡刻意不放 schedule：public repo 60 天沒活動時，含排程的 workflow 會被停用，
# 拆開之後就算 backup.yml 被停用，這個主流程還是能被 cron-job.org 觸發。
on:
  workflow_dispatch:
    inputs:
      force:
        description: "不管時段、今天有沒有發過，都直接發一次（測試用）"
        type: boolean
        default: false
  workflow_call:
    inputs:
      force:
        type: boolean
        default: false

concurrency:
  group: claude-usage
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send report
        env:
          CLAUDE_REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # 上一則訊息的 ID，bot 會自動維護，用來刪掉舊訊息
          LAST_DISCORD_MESSAGE_ID: ${{ secrets.LAST_DISCORD_MESSAGE_ID }}
          # 最後一次發報告是哪一天，用來避免重複發送
          LAST_SENT_DAY: ${{ secrets.LAST_SENT_DAY }}
          FORCE: ${{ inputs.force && '1' || '' }}
          # 用來把輪替後的 refresh token 寫回 Secret（需要 Secrets 讀寫權限的 PAT）
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TIMEZONE: Asia/Taipei
        run: python bot.py
