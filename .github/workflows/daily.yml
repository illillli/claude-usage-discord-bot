name: Daily Claude usage report

on:
  schedule:
    # GitHub 用 UTC：15:00 UTC = 台灣時間 23:00。
    # GitHub 的排程常常被延後或直接跳過，所以多排幾個時間當備援；
    # bot.py 會擋掉同一天的重複發送、以及 22:00–03:00 以外的時段。
    - cron: "3 15 * * *"
    - cron: "23 15 * * *"
    - cron: "43 15 * * *"
    - cron: "13 16 * * *"
  workflow_dispatch: # 外部排程（cron-job.org）或手動按 Run 觸發
    inputs:
      force:
        description: "不管時段、今天有沒有發過，都直接發一次（測試用）"
        type: boolean
        default: false

concurrency:
  group: claude-usage
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send report
        env:
          CLAUDE_REFRESH_TOKEN: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          # 上一則訊息的 ID，bot 會自動維護，用來刪掉舊訊息
          LAST_DISCORD_MESSAGE_ID: ${{ secrets.LAST_DISCORD_MESSAGE_ID }}
          # 最後一次發報告是哪一天，用來避免重複發送
          LAST_SENT_DAY: ${{ secrets.LAST_SENT_DAY }}
          FORCE: ${{ inputs.force && '1' || '' }}
          # 用來把輪替後的 refresh token 寫回 Secret（需要 Secrets 讀寫權限的 PAT）
          GH_TOKEN: ${{ secrets.GH_PAT }}
          TIMEZONE: Asia/Taipei
        run: python bot.py
