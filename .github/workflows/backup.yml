name: Backup schedule

# GitHub 自己的排程常被延後或跳過，只當 cron-job.org 的備援。
# 時間是 UTC：04:xx = 台灣中午 12:xx，15:xx / 16:xx = 台灣晚上 23:xx / 00:xx。
# bot.py 會擋掉同一個時段的重複發送，以及 11:00–15:00、22:00–03:00 以外的時段。
on:
  schedule:
    - cron: "13 4 * * *"
    - cron: "43 4 * * *"
    - cron: "13 15 * * *"
    - cron: "43 15 * * *"
    - cron: "13 16 * * *"

jobs:
  report:
    uses: ./.github/workflows/daily.yml
    secrets: inherit
